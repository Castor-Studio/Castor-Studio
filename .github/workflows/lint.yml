name: Lint

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: read

env:
  NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  dotnet-format:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          source-url: https://nuget.pkg.github.com/Castor-Studio/index.json

      - name: Restore
        run: dotnet restore Castor-Studio.sln

      - name: Check formatting
        run: dotnet format Castor-Studio.sln --verify-no-changes --no-restore
